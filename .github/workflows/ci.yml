# Build, type-check and test Leanler on macOS and Linux. The steps live in ci/steps.yml and run
# under samrose/beam-action, so the same file runs locally. Erlang and Elixir come from pixi; Lean
# comes from elan, because conda-forge has no Lean 4. The tests build test/fixture with the real
# toolchain and call it as a NIF and as a C node, so a green run covers each platform's link line.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          cache: true

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Run ci/steps.yml with beam-action
        run: nix run github:samrose/beam-action -- ci/steps.yml
